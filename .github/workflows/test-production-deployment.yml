name: Integration Tests for Deployed API
permissions:
  contents: read

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  integration_tests:
    if: ${{ github.repository == 'nsls2/nsls2api' }}  # Do not run on forks
    runs-on: self-hosted
    env:
      # Zulu's bundled cacerts no longer trusts emSign Root CA - G1 (removed after the
      # eMudhra CA compromise), so use the host's trust store, which the site manages.
      IJHTTP_JAVA_OPTS: >-
        -Djavax.net.ssl.trustStore=/etc/pki/java/cacerts
        -Djavax.net.ssl.trustStorePassword=changeit

    steps:
    - name: Print hostname
      run: echo "The hostname is $(hostname)"
      
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'
        settings-path: ${{ github.workspace }}  # Create settings.xml here
    
    - name: Download ijhttp.zip 
      run: curl -f -L -o ijhttp.zip "https://jb.gg/ijhttp/latest"

    - name: Unzip ijhttp.zip
      run: unzip -q ijhttp.zip

    - name: Beamline endpoint tests
      run: |
        ./ijhttp/ijhttp --env-file ./integration-tests/http-client.env.json \
        --env production \
        ./integration-tests/check_all_beamlines.http

    - name: Check API Service
      run: |
        ./ijhttp/ijhttp --env-file ./integration-tests/http-client.env.json \
        --env production \
        ./integration-tests/check_service_health.http
